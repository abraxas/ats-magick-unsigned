records:
  accept_threads: 1
  admin:
    user_id: nobody
  cache:
    ram_cache:
      size: 2M
  diags:
    debug:
      enabled: 1
      tags: ats-magick
    output:
      debug: E
      diag: E
      error: E
      warning: E
  exec_thread:
    autoconfig:
      enabled: 0
    limit: 2
  http:
    cache:
      http: 0
    server_ports: 8080
    transaction_no_activity_timeout_in: 30
    transaction_no_activity_timeout_out: 30
  log:
    logging_enabled: 1
  net:
    connections_throttle: 256
    max_connections_in: 256
  reverse_proxy:
    enabled: 1
  task_threads: 1
  url_remap:
    remap_required: 1
